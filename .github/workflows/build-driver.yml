name: Build MT7668 Bluetooth Driver

on:
  workflow_dispatch: # 允许你手动触发

jobs:
  build:
    runs-on: ubuntu-22.04 # 使用与 CoreELEC 构建环境匹配的 Ubuntu 版本

    steps:
      - name: Checkout CoreELEC
        uses: actions/checkout@v4
        with:
          repository: 'trancedj20230423/CoreELEC'
          ref: 'coreelec-22' # 你的目标分支

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc g++ flex bison libssl-dev \
            libncurses5-dev libelf-dev bc python3 python3-pip \
            wget curl rsync cpio unzip

      - name: Download and Setup Toolchain
        run: |
          # 以下步骤会触发 CoreELEC 构建系统下载工具链和内核源码
          # 通过运行一个短暂的构建来初始化环境
          PROJECT=Amlogic-ce DEVICE=Amlogic-no ARCH=aarch64 make linux-source
          # 找到工具链路径并设置环境变量
          TOOLCHAIN_PATH=$(find ${{ github.workspace }}/build.CoreELEC-Amlogic-no.aarch64-22/toolchain/bin -name "aarch64-libreelec-linux-gnu-gcc" | head -1)
          echo "TOOLCHAIN_PATH=$TOOLCHAIN_PATH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$(dirname $TOOLCHAIN_PATH)/aarch64-libreelec-linux-gnu-" >> $GITHUB_ENV
          echo "KERNEL_DIR=$(find ${{ github.workspace }}/build.CoreELEC-Amlogic-no.aarch64-22/build -maxdepth 1 -name 'linux-*' -type d | head -1)" >> $GITHUB_ENV

      - name: Compile Bluetooth Driver
        run: |
          # 克隆 MT7668 驱动源码
          git clone https://github.com/CoreELEC/MT7668.git
          cd MT7668/MT7668-Bluetooth

          # 编译驱动模块
          make -C ${{ env.KERNEL_DIR }} \
            M=$(pwd) \
            ARCH=arm64 \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            EXTRA_CFLAGS="-w" \
            modules

      - name: Upload Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt_mt7668-fixed
          path: MT7668/MT7668-Bluetooth/bt_mt7668.ko
          if-no-files-found: error
