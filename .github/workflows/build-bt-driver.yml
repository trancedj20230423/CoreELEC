name: Build MT7668 Bluetooth Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      PROJECT: Amlogic-ce
      DEVICE: Amlogic-no
      ARCH: aarch64

    steps:
      - name: Checkout CoreELEC
        uses: actions/checkout@v4
        with:
          repository: trancedj20230423/CoreELEC
          ref: coreelec-22
          path: CoreELEC

      - name: Checkout linux-amlogic
        uses: actions/checkout@v4
        with:
          repository: trancedj20230423/linux-amlogic
          ref: 5.15.196_20260306
          path: linux-amlogic
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev bc flex bison \
            libncurses5-dev libelf-dev python3 \
            clang lld llvm git wget curl cpio rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            uuid-dev swig python3-dev

      - name: Prepare CoreELEC build environment
        working-directory: CoreELEC
        run: |
          ./scripts/build linux

      - name: Replace kernel source with custom linux-amlogic
        working-directory: CoreELEC
        run: |
          KERNEL_DIR=$(find build.CoreELEC-Amlogic-no.aarch64-22/build -maxdepth 1 -name 'linux-*' -type d | head -1)
          echo "Kernel dir: $KERNEL_DIR"
          cp $KERNEL_DIR/.config /tmp/kernel.config
          cp $KERNEL_DIR/Module.symvers /tmp/Module.symvers 2>/dev/null || true
          rsync -a --delete ../linux-amlogic/ $KERNEL_DIR/
          cp /tmp/kernel.config $KERNEL_DIR/.config
          cp /tmp/Module.symvers $KERNEL_DIR/Module.symvers 2>/dev/null || true

      - name: Clone MT7668 driver source
        run: |
          git clone https://github.com/CoreELEC/MT7668.git MT7668

      - name: Compile Bluetooth driver
        run: |
          KERNEL_DIR=$(find CoreELEC/build.CoreELEC-Amlogic-no.aarch64-22/build -maxdepth 1 -name 'linux-*' -type d | head -1)
          echo "Using kernel: $KERNEL_DIR"

          cd MT7668/MT7668-Bluetooth

          make -C $KERNEL_DIR \
            M=$(pwd) \
            ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            EXTRA_CFLAGS="-w" \
            modules

      - name: Verify vermagic
        run: |
          modinfo MT7668/MT7668-Bluetooth/bt_mt7668.ko | grep vermagic

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt_mt7668-ko
          path: MT7668/MT7668-Bluetooth/bt_mt7668.ko
          if-no-files-found: error
